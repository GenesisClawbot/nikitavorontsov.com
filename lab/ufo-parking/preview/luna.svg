<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Soft Landing opening screen</title><desc id="desc">A calm dark teal opening screen with a small saucer, flight school label and hold to lift control.</desc>
  <defs><radialGradient id="bg"><stop stop-color="#193b4a"/><stop offset="1" stop-color="#06111e"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="900" height="620" fill="url(#bg)"/><g stroke="#72f4d0" stroke-opacity=".08"><path d="M0 420H900M0 500H900M100 0V620M220 0V620M340 0V620M460 0V620M580 0V620M700 0V620M820 0V620"/></g>
  <g transform="translate(450 187)" filter="url(#glow)"><ellipse rx="128" ry="26" fill="#72f4d0" opacity=".78"/><ellipse cy="-16" rx="48" ry="28" fill="#ecffde" opacity=".8"/><circle cy="-26" r="7" fill="#ecffde"/></g>
  <text x="450" y="75" fill="#83b9b0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" letter-spacing="4">— FLIGHT SCHOOL / 01 —</text><text x="450" y="300" fill="#f0faf2" font-family="system-ui, sans-serif" font-size="48" font-weight="300" text-anchor="middle" letter-spacing="8">UFO</text><text x="450" y="346" fill="#72f4d0" font-family="system-ui, sans-serif" font-size="39" font-weight="700" text-anchor="middle" letter-spacing="10">PARKING</text>
  <text x="450" y="392" fill="#b5c9c8" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">One little saucer. A very short runway.</text><text x="450" y="420" fill="#91a9ac" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">How many perfect arrivals in 45 seconds?</text>
  <rect x="296" y="472" width="308" height="56" rx="11" fill="#123c45" stroke="#80f5d1" stroke-opacity=".55"/><circle cx="330" cy="500" r="18" fill="#236d69" stroke="#72f4d0"/><text x="330" y="506" fill="#ecffde" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">✦</text><text x="365" y="495" fill="#dcfff1" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="2">HOLD TO LIFT</text><text x="365" y="515" fill="#87a7a6" font-family="system-ui, sans-serif" font-size="9" letter-spacing="1">ALIGN THE BEAM · RELEASE TO LAND</text>
</svg>
