<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Saucer Parking opening screen</title><desc id="desc">A neon pink and violet opening screen with a saucer, stars and a press space prompt.</desc>
  <defs><radialGradient id="bg"><stop stop-color="#29145a"/><stop offset="1" stop-color="#08051d"/></radialGradient><linearGradient id="beam" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#6fffe1" stop-opacity=".75"/><stop offset="1" stop-color="#6fffe1" stop-opacity="0"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="900" height="620" fill="url(#bg)"/><g fill="#bafcff" opacity=".8"><circle cx="91" cy="90" r="3"/><circle cx="178" cy="180" r="2"/><circle cx="760" cy="105" r="3"/><circle cx="830" cy="260" r="2"/><circle cx="650" cy="62" r="2"/></g>
  <path d="M330 280 L570 280 L650 530 L250 530 Z" fill="url(#beam)" opacity=".25"/>
  <g filter="url(#glow)"><ellipse cx="450" cy="250" rx="142" ry="35" fill="#7a5cff" stroke="#ff4fd8" stroke-width="7"/><ellipse cx="450" cy="230" rx="54" ry="30" fill="#bafcff" opacity=".9"/><ellipse cx="450" cy="263" rx="74" ry="12" fill="#3dff9a"/></g>
  <text x="450" y="95" fill="#fff" font-family="Trebuchet MS, sans-serif" font-size="43" font-weight="900" text-anchor="middle" letter-spacing="4" transform="rotate(-3 450 95)">SAUCER</text><text x="450" y="137" fill="#bafcff" font-family="Trebuchet MS, sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="9">PARKING</text>
  <text x="450" y="405" fill="#e8e2ff" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">Hold to thrust · release to drift</text><text x="450" y="438" fill="#3dff9a" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Park as many times as you can</text>
  <rect x="286" y="480" width="328" height="58" rx="29" fill="#ff4fd8"/><text x="450" y="517" fill="#fff" font-family="system-ui, sans-serif" font-size="17" font-weight="900" text-anchor="middle" letter-spacing="2">PRESS SPACE OR TAP</text>
</svg>
