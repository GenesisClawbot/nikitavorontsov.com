<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">UFO Valet opening screen</title><desc id="desc">A dark blue and teal opening screen with a contract card, UFO illustration and start shift button.</desc>
  <defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#263452"/><stop offset="1" stop-color="#070c1e"/></linearGradient><linearGradient id="card" x2="1" y2="1"><stop stop-color="#19304a"/><stop offset="1" stop-color="#0a162e"/></linearGradient><filter id="soft"><feGaussianBlur stdDeviation="12"/></filter></defs>
  <rect width="900" height="620" fill="url(#bg)"/><circle cx="720" cy="150" r="120" fill="#5dffe0" opacity=".08" filter="url(#soft)"/>
  <rect x="274" y="50" width="352" height="520" rx="18" fill="url(#card)" stroke="#80eae3" stroke-opacity=".45"/><rect x="274" y="50" width="160" height="3" fill="#69ffe0"/>
  <text x="304" y="87" fill="#a6e9df" font-family="system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="2">● INCOMING CONTRACT</text><text x="595" y="87" fill="#7794aa" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">VOL. 01 / NIGHT</text>
  <g transform="translate(450 190)"><circle r="85" fill="#102b43" opacity=".8"/><path d="M-95 32 Q0 8 95 32 L70 52 Q0 72 -70 52Z" fill="#6fffe1" opacity=".85"/><ellipse cy="22" rx="42" ry="26" fill="#d8fff7" opacity=".75"/><path d="M-55 51 L55 51 L80 120 L-80 120Z" fill="#5dffe0" opacity=".13"/></g>
  <text x="450" y="315" fill="#a6e9df" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="2">ONE BUTTON · SIX LANDINGS · ONE NIGHT</text><text x="450" y="360" fill="#f1f7ff" font-family="system-ui, sans-serif" font-size="36" font-weight="800" text-anchor="middle">THE NIGHT</text><text x="450" y="400" fill="#6fffe1" font-family="system-ui, sans-serif" font-size="36" font-weight="800" text-anchor="middle">SHIFT.</text>
  <rect x="344" y="448" width="212" height="48" rx="24" fill="#69ffe0"/><text x="450" y="479" fill="#092035" font-family="system-ui, sans-serif" font-size="15" font-weight="900" text-anchor="middle" letter-spacing="2">START SHIFT ↗</text><text x="450" y="535" fill="#8193ad" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" letter-spacing="2">SPACE / ENTER TO START</text>
</svg>
