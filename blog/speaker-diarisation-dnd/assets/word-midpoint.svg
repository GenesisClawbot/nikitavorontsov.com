<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
<title id="title">Assigning one word with a midpoint</title>
<desc id="desc">Fictional example. Word 42 spans 10.42 to 10.68 seconds. Its midpoint, 10.55, falls in Sam's turn after a speaker change at 10.50. The method predicts Sam; the checked reference is Alex, so this is one wrong name.</desc>
<defs><pattern id="paper" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ded4c3"/></pattern></defs>
<rect width="720" height="480" rx="15" fill="#fcf8ee"/>
<rect x="10" y="10" width="700" height="460" rx="12" fill="url(#paper)" opacity=".66"/>
<g fill="#243243" font-family="DejaVu Sans,sans-serif">
<text x="32" y="46" font-size="26" font-weight="bold" fill="#665022">FICTIONAL EXAMPLE · WORD 42</text>
<path d="M126 76 Q360 72 594 76 L595 128 Q367 132 126 128Z" fill="#fff0bb" stroke="#a27d39" stroke-width="2"/>
<text x="146" y="111" font-size="27">10.42 s</text>
<text x="574" y="111" text-anchor="end" font-size="27">10.68 s</text>
<path d="M360 122 L359 251 M351 243 L359 252 L367 243" fill="none" stroke="#873a2b" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5"/>
<text x="377" y="178" font-size="26" font-weight="bold" fill="#873a2b">Midpoint: 10.55 s</text>
<text x="34" y="207" font-size="26" font-weight="bold">Speaker turns</text>
<path d="M90 218 Q170 216 270 218 L270 274 L90 274Z" fill="#e3eaf3" stroke="#4b6581" stroke-width="2"/>
<path d="M270 218 Q446 216 630 218 L630 274 L270 274Z" fill="#e3efe8" stroke="#386750" stroke-width="2"/>
<text x="180" y="255" text-anchor="middle" font-size="29" font-weight="bold">Alex</text>
<text x="485" y="255" text-anchor="middle" font-size="29" font-weight="bold">Sam</text>
<circle cx="359" cy="249" r="6" fill="#873a2b"/>
<path d="M270 276v8" stroke="#344456" stroke-width="2"/>
<text x="270" y="310" text-anchor="middle" font-size="25">10.50 s change</text>
<path d="M34 334 Q187 331 350 333 T684 335 L684 443 Q510 446 330 443 T34 445Z" fill="#edf3f9" stroke="#49627d" stroke-width="2"/>
<text x="53" y="374" font-size="27">Predicted: <tspan font-weight="bold">Sam</tspan></text>
<text x="376" y="374" font-size="27">Checked: <tspan font-weight="bold">Alex</tspan></text>
<text x="53" y="422" font-size="30" font-weight="bold" fill="#863925">One wrong name</text>
</g>
</svg>
